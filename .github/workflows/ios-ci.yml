name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + Test (Core + iOS)
        # No --sim flag: build_and_test.sh resolves the best available
        # simulator at runtime via xcrun simctl. See AGENTS.md —
        # "Simulator Detection — Required Pattern".
        run: |
          ./utility/build_and_test.sh --fast

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build_results
