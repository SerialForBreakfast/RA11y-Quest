name: iOS Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    env:
      # No SNAPSHOT_DEVICES override: the Fastfile resolves simulators at
      # runtime via xcrun simctl using the preference hierarchy in Fastfile.
      # Set SNAPSHOT_DEVICES to override, e.g.:
      #   SNAPSHOT_DEVICES: "iPhone 16, iPad Pro (13-inch)"
      # See AGENTS.md — "Simulator Detection — Required Pattern".
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Capture Screenshots
        run: |
          bundle exec fastlane screenshots

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            fastlane/screenshots
            fastlane/test_output
            build_results/screen-audit
