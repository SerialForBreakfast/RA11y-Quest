name: iOS Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    env:
      SNAPSHOT_DEVICES: "iPhone 15, iPhone SE (3rd generation), iPad (10th generation)"
      SNAPSHOT_IOS_VERSION: "17.5"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Capture Screenshots
        run: |
          bundle exec fastlane screenshots

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            fastlane/screenshots
            fastlane/test_output
